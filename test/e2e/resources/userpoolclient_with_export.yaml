apiVersion: cognitoidentityprovider.services.k8s.aws/v1alpha1
kind: UserPoolClient
metadata:
  name: $USERPOOLCLIENT_NAME
spec:
  name: $USERPOOLCLIENT_NAME
  userPoolID: $USERPOOL_ID
  generateSecret: true
  explicitAuthFlows:
    - ALLOW_USER_SRP_AUTH
    - ALLOW_REFRESH_TOKEN_AUTH
  exportClientSecret:
    key: $USERPOOLCLIENT_SECRET_KEY
    name: $USERPOOLCLIENT_SECRET_NAME

